# The license for your mod. This is mandatory metadata and allows for easier comprehension of your redistributable properties.
license="${mod_license}"

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]]

# The modid of the mod
modId="${mod_id}"

# The version number of the mod
version="${mod_version}"

# A display name for the mod
displayName="${mod_name}"

# A URL to query for updates for this mod. See the JSON update specification https://docs.neoforged.net/docs/misc/updatechecker/
#updateJSONURL="https://change.me.example.invalid/updates.json"

# A URL for the "homepage" for this mod, displayed in the mod UI
displayURL="https://modrinth.com/mod/imageframeclient"

# A file name (in the root of the mod JAR) containing a square icon for display
iconFile="assets/imageframeclient/icon.png"

# The authors of the mod, displayed in the mod UI
authors="LOOHP"

# A text field displayed in the mod UI
credits="https://github.com/LOOHP/ImageFrameClient"

# The description text for the mod (multi line!) (#mandatory)
description='''
Complementary client mod for servers with ImageFrame to display HD and full color images!
'''

# The [[mixins]] block allows you to declare your mixin config to FML so that it gets loaded.
[[mixins]]
config="${mod_id}.mixins.json"

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.${mod_id}]]
    # the modid of the dependency
    modId="neoforge"
    # The type of the dependency. Can be one of "required", "optional", "incompatible" or "discouraged" (case insensitive).
    type="required"
    # The version range of the dependency
    versionRange="[${neo_version},)"
    # An ordering relationship the dependency.
    ordering="NONE"
    # Side this dependency is applied on - BOTH, CLIENT, or SERVER
    side="CLIENT"

# MidnightLib provides MidnightConfig, the library used to store and edit the configuration of this mod.
[[dependencies.${mod_id}]]
    modId="midnightlib"
    type="required"
    versionRange="[1.9,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"
